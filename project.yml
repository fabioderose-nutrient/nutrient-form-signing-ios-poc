name: OnboardingPacket
options:
  bundleIdPrefix: io.nutrient.poc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Nutrient:
    url: https://github.com/PSPDFKit/PSPDFKit-SP
    exactVersion: 27.1.0
targets:
  OnboardingPacket:
    type: application
    platform: iOS
    sources:
      - OnboardingPacket
    dependencies:
      - package: Nutrient
        product: PSPDFKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nutrient.poc.formsigning
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: OnboardingPacket/Info.plist
        CODE_SIGN_STYLE: Automatic
  OnboardingPacketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OnboardingPacketUITests
    dependencies:
      - target: OnboardingPacket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nutrient.poc.formsigning.uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OnboardingPacket
schemes:
  OnboardingPacket:
    build:
      targets:
        OnboardingPacket: all
    test:
      targets:
        - OnboardingPacketUITests
